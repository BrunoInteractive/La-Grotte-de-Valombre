<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#251e17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <meta name="apple-mobile-web-app-title" content="Valombre" />
  <meta name="application-name" content="La Grotte de Valombre" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="La Grotte de Valombre — livre-jeu interactif médiéval fantastique." />
  <title>La Grotte de Valombre — Livre-jeu</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:wght@500;600&display=swap');



:root {
  --desk: #1a1511;
  --desk2: #2a2119;
  --paper: #eadcb9;
  --paper-light: #f1e6cc;
  --paper-mid: #e6d5af;
  --paper-edge: #b79e72;
  --paper-edge-dark: #856a46;
  --ink: #1a1410;
  --ink-soft: #5a4938;
  --rule: #765c39;
  --rule-light: #c0a16a;
  --cartouche: #2d2017;
  --cartouche-light: #493527;
  --gold: #9b7a49;
  --danger: #71372f;
  --body-font: 'EB Garamond', Garamond, 'Times New Roman', serif;
  --display-font: 'Cormorant Garamond', Garamond, 'Times New Roman', serif;
}


* { box-sizing: border-box; }
html, 
body {
  margin: 0;
  color: var(--ink);
  font-family: var(--body-font);
  font-kerning: normal;
  font-variant-ligatures: common-ligatures;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(171,128,73,.11), transparent 42%),
    linear-gradient(180deg, var(--desk2), var(--desk));
}

button { font: inherit; }


.app-shell {
  min-height: 100vh;
  max-width: 1060px;
  margin: 0 auto;
  padding: max(12px, env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom));
}

.topbar {
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:16px;
  padding: 8px 6px 14px;
  color: #dcc79b;
}
.topbar h1 {
  margin: 0;
  font-family: var(--display-font);
  font-size: clamp(24px, 4.6vw, 34px);
  line-height: 1;
  font-weight: 600;
  letter-spacing: .01em;
}
.eyebrow {
  margin-bottom: 4px;
  font-family: var(--body-font);
  letter-spacing: .16em;
  font-size: 11px;
  color: #bea375;
}
.icon-btn {
  border: 1px solid rgba(180,153,109,.52);
  background: linear-gradient(180deg, rgba(73,55,38,.95), rgba(42,31,22,.95));
  color: #ead9b3;
  border-radius: 0;
  width: 42px;
  height: 42px;
  cursor: pointer;
  font-family: var(--body-font);
  font-size: 20px;
  box-shadow: inset 0 0 0 1px rgba(27,18,11,.45);
}



/* Page unique : on reproduit une page de livre-jeu imprimé, pas une interface web moderne. */
.game {
  position: relative;
  padding: 16px 16px 24px;
  border: 1px solid #89704b;
  background:
    radial-gradient(circle at 12% 18%, rgba(126,94,54,.035) 0 1.2px, transparent 1.9px),
    radial-gradient(circle at 76% 70%, rgba(126,94,54,.028) 0 1px, transparent 1.7px),
    linear-gradient(180deg, var(--paper-light), var(--paper-mid));
  box-shadow:
    0 0 0 2px rgba(102,79,48,.22),
    0 20px 52px rgba(0,0,0,.24);
}
.game .print-grain { display:none; }
.game::before,
.game::after {
  content:'';
  position:absolute;
  pointer-events:none;
}
.game::before {
  inset: 6px;
  border: 1px solid rgba(116,90,56,.62);
  box-shadow:
    inset 0 0 0 1px rgba(241,231,206,.92),
    inset 0 0 0 5px rgba(163,134,87,.10);
}
.game::after {
  inset: 0;
  background:
    linear-gradient(90deg, rgba(71,52,32,.13), transparent 2.1%, transparent 97.9%, rgba(71,52,32,.11)),
    linear-gradient(180deg, rgba(71,52,32,.09), transparent 2.2%, transparent 97.6%, rgba(71,52,32,.09));
  opacity: .55;
  mix-blend-mode: multiply;
}

.game::before {
  inset: 8px;
  border: 1px solid rgba(92,68,39,.72);
  outline: 1px solid rgba(163,133,85,.48);
  outline-offset: -4px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.17);
}
.game::after {
  inset: 0;
  opacity: .28;
  background:
    linear-gradient(90deg, rgba(64,43,24,.26), transparent 2.1%, transparent 97.6%, rgba(64,43,24,.20)),
    linear-gradient(180deg, rgba(64,43,24,.13), transparent 2.6%, transparent 97.2%, rgba(64,43,24,.13));
  mix-blend-mode: multiply;
}



.image-frame {
  position: relative;
  z-index: 2;
  aspect-ratio: 4/3;
  margin: 6px 6px 0;
  border: 1px solid #6e5739;
  background: #cab995;
  overflow: hidden;
  box-shadow:
    inset 0 0 0 1px rgba(245,235,211,.95),
    inset 0 0 0 4px rgba(104,82,52,.46);
}
.image-frame::after {
  content:'';
  position:absolute;
  inset:0;
  pointer-events:none;
  box-shadow:
    inset 0 0 0 6px rgba(236,225,198,.18),
    inset 0 0 20px rgba(26,18,12,.10);
}
.story-image { width:100%; height:100%; display:block; object-fit:cover; object-position:center; }
.story-image.hidden { display:none; }
.image-placeholder {
  width:100%; height:100%;
  display:grid;
  place-content:center;
  gap:8px;
  text-align:center;
  background: linear-gradient(180deg, #d7c5a3, #cfbb94);
  color:#5e4c37;
  font-family:var(--body-font);
}
.image-placeholder span { font-size:13px; letter-spacing:.06em; }
.image-placeholder small { font-size:11px; letter-spacing:.02em; opacity:.9; }





.story-card {
  position:relative;
  z-index:2;
  margin: 18px 18px 0;
  padding: 0 26px 0;
  background: transparent;
  border: 0;
}
.chapter-number {
  display:block;
  margin: 0 0 8px;
  color:#6a563c;
  font-family:var(--body-font);
  font-size:14px;
  letter-spacing:.02em;
  text-align:right;
}
.story-card h2 {
  margin: 0 0 16px;
  text-align:center;
  color:#221912;
  font-family:var(--display-font);
  font-size: clamp(40px, 6vw, 58px);
  line-height: 1;
  font-weight: 600;
  letter-spacing: 0;
}
.story-card h2::after { content:none; }




.story-text {
  max-width: 860px;
  margin: 0 auto;
  color:#19130f;
  font-family:var(--body-font);
  font-size: clamp(21px, 2.65vw, 25px);
  line-height: 1.22;
  font-weight: 500;
  letter-spacing: -.004em;
  text-align: left;
  hyphens: none;
}
.story-text p {
  margin: 0 0 .28em;
  text-indent: 0;
}
.story-text p:first-child { text-indent:0; }
.story-text p:first-child::first-letter {
  float:none;
  margin:0;
  color:inherit;
  font-family:inherit;
  font-size:inherit;
  line-height:inherit;
}




.story-text blockquote {
  margin: .9em 0;
  padding: 0;
  border: 0;
  color:#2f2419;
  font-style: italic;
  text-align:center;
  background:none;
}


.story-text ul { padding-left:1.25em; }
.story-text .ending {
  margin:27px auto 0;
  padding:13px 14px;
  border-top:4px double #826846;
  border-bottom:4px double #826846;
  text-align:center;
  color:#563923;
  font-family:var(--display-font);
  font-weight:600;
  letter-spacing:.10em;
}


.status-tags {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  margin: 15px 0 0;
}
.tag {
  border:1px solid rgba(122,96,60,.48);
  background: rgba(255,255,255,.08);
  color:#5f4730;
  padding: 4px 9px;
  font-family:var(--body-font);
  font-size:13px;
}



/* Cartouches de choix : inspirés d'une maquette de livre imprimé, pas d'une UI moderne. */
.choices {
  position:relative;
  display:grid;
  grid-template-columns:repeat(2, minmax(0,1fr));
  gap: 20px;
  margin: 22px auto 6px;
  padding-top: 4px;
  max-width: 860px;
}
.choice-btn {
  position:relative;
  display:flex;
  align-items:stretch;
  width:100%;
  min-height:140px;
  border:1px solid #896d48;
  background: linear-gradient(180deg, #efe2c3, #ecdcbc);
  color:var(--ink);
  padding: 18px 18px 54px;
  border-radius:0;
  cursor:pointer;
  box-shadow:
    inset 0 0 0 1px rgba(243,234,212,.98),
    inset 0 0 0 4px rgba(121,95,62,.28);
  transition:none;
}
.choice-btn::before,
.choice-btn::after {
  content:'';
  position:absolute;
  width:14px;
  height:14px;
  border-color:#a18255;
}
.choice-btn::before {
  left:8px;
  top:8px;
  border-left:1px solid;
  border-top:1px solid;
}
.choice-btn::after {
  right:8px;
  top:8px;
  border-right:1px solid;
  border-top:1px solid;
}
.choice-btn:hover { filter:none; transform:none; }
.choice-copy {
  display:flex;
  flex:1;
  flex-direction:column;
  justify-content:center;
  text-align:center;
  font-family:var(--body-font);
  font-size:20px;
  line-height:1.18;
  font-weight:500;
}
.choice-dest {
  position:absolute;
  left:8px;
  right:8px;
  bottom:8px;
  min-height:36px;
  display:grid;
  place-items:center;
  padding: 6px 10px;
  border:1px solid #20160f;
  background: linear-gradient(180deg, #453125, #2b2018);
  color:#efdfbd;
  font-family:var(--body-font);
  font-size:17px;
  font-weight:600;
  letter-spacing:0;
}
.choice-dest::before,
.choice-dest::after { content:''; margin:0; }
.choice-btn:only-child,
.choice-btn:last-child:nth-child(odd) {
  grid-column:1 / -1;
  max-width:390px;
  justify-self:center;
}




.footer {
  position: static;
  width: min(860px,100%);
  margin: 16px auto 0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:0;
  background:none;
}
.footer-btn, .drawer-action {
  border:1px solid rgba(166,136,93,.58);
  background: linear-gradient(180deg, #4e3929, #2b1f17);
  color:#efe0ba;
  padding: 11px 13px;
  border-radius:0;
  cursor:pointer;
  font-family:var(--body-font);
  font-size:15px;
  box-shadow: inset 0 0 0 1px rgba(30,21,15,.5);
}
.footer-btn span {
  display:inline-grid;
  place-items:center;
  min-width:20px;
  height:20px;
  margin-left:4px;
  background:#b99762;
  color:#1e1710;
  font-size:11px;
  font-weight:700;
}

.danger { color:#e5c1b4; }

.backdrop { position:fixed; inset:0; background:rgba(0,0,0,.61); backdrop-filter:blur(3px); z-index:30; }
.hidden { display:none !important; }

.drawer {
  position:fixed;
  top:0;
  right:0;
  width:min(360px,88vw);
  height:100%;
  z-index:40;
  color:var(--ink);
  background:linear-gradient(180deg, #efe2c0, #e2cf9f);
  border-left:1px solid #7b6546;
  padding:max(18px,env(safe-area-inset-top)) 18px 18px;
  transform:translateX(102%);
  transition:transform .2s ease;
  box-shadow:-16px 0 38px rgba(0,0,0,.34);
}
.drawer.open { transform:translateX(0); }
.drawer-head { display:flex; justify-content:space-between; align-items:center; gap:12px; }
.drawer-head h3 { margin:0; font-family:var(--display-font); font-size:30px; font-weight:600; }
.drawer .icon-btn,.modal .icon-btn { color:#34271b; background:transparent; border-color:#8b7452; box-shadow:none; }
.drawer-action { display:block; width:100%; text-align:left; margin-top:12px; background:rgba(83,61,39,.08); color:#392b1f; border-color:#907552; }
.drawer-note { margin-top:22px; color:#6b5a45; font:14px/1.4 var(--body-font); }
.danger-text { color:#793f36; }


.modal { position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:18px; }

.modal-card {
  width:min(520px,100%);
  max-height:80vh;
  overflow:auto;
  color:var(--ink);
  background:linear-gradient(180deg, #f1e5c4, #e5d3a9);
  border:1px solid #806847;
  border-radius:0;
  padding:18px;
  box-shadow:0 18px 40px rgba(0,0,0,.32);
}
.inventory-list { display:grid; gap:10px; margin-top:16px; }
.inventory-item { padding:12px; border:1px solid #987d57; background:rgba(255,255,255,.14); }
.inventory-item strong { display:block; color:#6c4a2e; margin-bottom:4px; }
.inventory-empty { color:#6b5a45; margin-top:14px; }



@media (max-width:620px) {
  .app-shell { padding-left:10px; padding-right:10px; }
  .topbar { padding-left:2px; padding-right:2px; }
  .topbar h1 { font-size:26px; }
  .game { padding: 12px 12px 20px; box-shadow: 0 14px 36px rgba(0,0,0,.24); }
  .game::before { inset: 5px; }
  .image-frame { margin: 4px 4px 0; }
  .story-card { margin: 14px 10px 0; padding:0 8px; }
  .chapter-number { font-size:13px; }
  .story-card h2 { font-size: 32px; margin-bottom: 12px; }
  .story-text { font-size: 18px; line-height: 1.22; }
  .choices { grid-template-columns:1fr; gap:12px; }
    .choice-btn { min-height: 120px; padding: 14px 12px 48px; }
  .choice-copy { font-size: 17px; }
  .choice-dest { font-size: 15px; min-height: 32px; }
  .footer { grid-template-columns:1fr 1fr; }
}



  .choices { grid-template-columns:1fr; gap:12px; margin-top:27px; }
  .choice-btn { min-height:116px; }
  .choice-copy { font-size:17px; }
}

  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">LIVRE-JEU INTERACTIF</div>
        <h1>La Grotte de Valombre</h1>
      </div>
      <button id="menuBtn" class="icon-btn" aria-label="Ouvrir le menu">☰</button>
    </header>

    <main id="game" class="game" aria-live="polite" data-design="livre-jeu-80s">
      <section class="image-frame" id="imageFrame">
        <img id="storyImage" class="story-image hidden" alt="" />
        <div class="image-placeholder" id="imagePlaceholder">
          <span>IMAGE À VENIR</span>
          <small id="imageLabel">La-Grotte-de-Valombre-01</small>
        </div>
      </section>

      <section class="story-card">
        <div class="chapter-number" id="chapterNumber"></div>
        <h2 id="chapterTitle"></h2>
        <div id="storyText" class="story-text"></div>
        <div id="statusTags" class="status-tags"></div>
        <div id="choices" class="choices"></div>
      </section>
    </main>

    <footer class="footer">
      <button id="inventoryBtn" class="footer-btn">Inventaire <span id="inventoryCount">0</span></button>
      <button id="restartBtn" class="footer-btn danger">Recommencer</button>
    </footer>
  </div>

  <div id="drawerBackdrop" class="backdrop hidden"></div>
  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h3>Menu</h3>
      <button id="closeDrawerBtn" class="icon-btn">×</button>
    </div>
    <button id="continueBtn" class="drawer-action">Continuer la partie</button>
    <button id="drawerInventoryBtn" class="drawer-action">Voir l’inventaire</button>
    <button id="drawerRestartBtn" class="drawer-action danger-text">Recommencer depuis le début</button>
    <div class="drawer-note">La progression est sauvegardée automatiquement sur cet appareil.</div>
  </aside>

  <div id="modalBackdrop" class="backdrop hidden"></div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="drawer-head">
        <h3 id="modalTitle">Inventaire</h3>
        <button id="closeModalBtn" class="icon-btn">×</button>
      </div>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
const STORY = {
  start: {
    number: 'PROLOGUE', title: 'Le cheval revenu seul', image: 'Valombre — Prologue',
    text: `
      <p>Depuis trois nuits, personne ne dort vraiment à Valombre.</p>
      <p>À la tombée du jour, quelque chose hurle dans les collines. Ce n'est ni un loup, ni un homme.</p>
      <p>La première nuit, les chiens du village ont aboyé jusqu'à l'aube. La deuxième, on a retrouvé trois chèvres éventrées derrière la maison du meunier. La troisième, le vieux Martin a disparu.</p>
      <p>Ce matin, le seigneur de Valombre a envoyé son chevalier, <strong>Sir Aldren de Rochebrune</strong>, explorer les grottes situées au nord du village.</p>
      <p>Tu es son écuyer. Mais Sir Aldren t'a ordonné de rester au village.</p>
      <blockquote>« Je serai revenu avant le coucher du soleil. »</blockquote>
      <p>Le soleil s'est couché depuis longtemps. Sir Aldren n'est pas revenu.</p>
      <p>Son cheval, lui, est revenu seul. La selle est couverte de sang.</p>
      <p>Accrochée à la selle, la sacoche de Sir Aldren est toujours là. Dans l'écurie, son ancienne épée repose contre le mur.</p>`,
    choices: [
      { label: "Prendre immédiatement l'épée et partir vers les grottes", to: 'c1' },
      { label: 'Fouiller la sacoche de Sir Aldren avant de partir', to: 'c2' },
      { label: "Demander de l'aide au village", to: 'c3' }
    ]
  },
  c1: {
    number: 'CHAPITRE 1', title: 'Le chemin des collines', image: 'Le chemin des collines',
    text: `<p>Tu quittes Valombre avec l'épée de Sir Aldren.</p><p>Après une demi-heure de marche, tu découvres un cadavre au milieu du chemin. C'est le vieux Martin.</p><p>Ses yeux sont ouverts. Sa poitrine semble intacte. Mais sa bouche est remplie de terre noire.</p><p>À côté de lui, le chemin se divise. À gauche, le sentier principal monte vers la grotte. À droite, une piste étroite descend dans les bois.</p><p>Tu remarques des traces de bottes allant vers la forêt.</p>`,
    choices: [
      { label: 'Inspecter le cadavre', to: 'c4' },
      { label: 'Suivre directement le sentier vers la grotte', to: 'c5' },
      { label: 'Suivre les traces dans la forêt', to: 'c6' }
    ]
  },
  c2: {
    number: 'CHAPITRE 2', title: 'La sacoche', image: 'La sacoche de Sir Aldren',
    text: `<p>À l'intérieur, tu trouves une petite lanterne à huile, trois pièces d'argent, un morceau de craie, une fiole contenant un liquide rouge sombre et une lettre pliée.</p><blockquote>« Aldren, les galeries sous Valombre sont plus anciennes que le village. Si tu trouves une porte portant le symbole de l'œil fermé, ne l'ouvre sous aucun prétexte. — Père Auguste. »</blockquote><p>Tu emportes la lanterne et la craie. Mais tu hésites devant la fiole.</p>`,
    onEnter: s => { s.flags.lanterne = true; s.flags.craie = true; s.flags.lettreLue = true; },
    choices: [
      { label: 'Prendre également la fiole rouge', to: 'c1', effect: s => addItem(s,'fiole','Fiole rouge','Un liquide rouge sombre trouvé dans la sacoche de Sir Aldren.') },
      { label: 'Laisser la fiole et partir', to: 'c1' }
    ]
  },
  c3: {
    number: 'CHAPITRE 3', title: "Chercher de l'aide", image: 'La forge de Valombre',
    text: `<p>Tu frappes chez plusieurs habitants. Personne ne veut sortir.</p><p>Finalement, le forgeron ouvre sa porte.</p><blockquote>« Aldren savait se battre. Si quelque chose l'a vaincu, toi et moi ne ferons pas mieux. »</blockquote><p>Il te donne cependant un petit marteau.</p><blockquote>« Prends ça. Ce n'est pas une épée, mais parfois il vaut mieux casser une serrure que combattre ce qu'elle protège. »</blockquote>`,
    onEnter: s => addItem(s,'marteau','Marteau','Un lourd marteau donné par le forgeron.'),
    choices: [{ label: 'Partir seul vers les collines', to: 'c1' }]
  },
  c4: {
    number: 'CHAPITRE 4', title: 'Le mort', image: 'Le corps de Martin',
    text: `<p>Tu t'agenouilles près de Martin. Quelque chose brille entre ses dents : une petite médaille de cuivre représentant un cercle traversé par trois lignes.</p><p>Au moment où tu te relèves, les yeux de Martin bougent. Sa main se referme brutalement sur ton poignet.</p><blockquote>« Il rêve sous la pierre… »</blockquote><p>Puis son corps se cambre.</p>`,
    choices: [
      { label: 'Reculer immédiatement', to: 'c7' },
      { label: 'Essayer de lui parler', to: 'c8' },
      { label: "Frapper Martin avec l'épée", to: 'c9' }
    ]
  },
  c5: {
    number: 'CHAPITRE 5', title: "L'entrée de la grotte", image: "L'entrée de la grotte",
    text: s => `<p>La grotte apparaît entre deux rochers. Devant l'entrée repose le bouclier de Sir Aldren, fendu en deux. Une traînée de sang disparaît dans l'obscurité.</p><p>À l'intérieur, deux passages. Le premier descend profondément sous terre. Le second suit la paroi de la montagne.</p>${s.flags.craie ? `<p>Sur le sol, quelqu'un a tracé une flèche avec de la craie. Tu reconnais celle de Sir Aldren.</p>` : `<p>Sur le sol, quelqu'un a tracé une flèche blanche qui indique le passage descendant.</p>`}`,

// Numérotation façon livre-jeu : 1 page = 1 nœud narratif.
// Le prologue est la page 01, puis les anciens chapitres 1 à 30 deviennent les pages 02 à 31.
const PAGE_ORDER = ['start', ...Array.from({ length: 30 }, (_, i) => `c${i + 1}`)];
const PAGE_BY_NODE = Object.fromEntries(PAGE_ORDER.map((id, i) => [id, i + 1]));
const padPage = n => String(n).padStart(2, '0');
const imageBaseForPage = n => `La-Grotte-de-Valombre-${padPage(n)}`;
const IMAGE_EXTENSIONS = ['webp', 'png', 'jpg', 'jpeg'];

function addItem(state, id, name, description) {
  if (!state.inventory[id]) state.inventory[id] = { name, description };
}
function hasItem(state, id) { return !!state.inventory[id]; }

  </script>
  <script>
const STORAGE_KEY = 'valombre_save_v1';

const defaultState = () => ({
  node: 'start',
  inventory: {},
  flags: {},
  visited: {},
  history: []
});

let state = loadState();

const chapterNumber = document.getElementById('chapterNumber');
const chapterTitle = document.getElementById('chapterTitle');
const storyText = document.getElementById('storyText');
const choices = document.getElementById('choices');
const storyImage = document.getElementById('storyImage');
const imagePlaceholder = document.getElementById('imagePlaceholder');
const imageLabel = document.getElementById('imageLabel');
const statusTags = document.getElementById('statusTags');
const inventoryCount = document.getElementById('inventoryCount');
const inventoryBtn = document.getElementById('inventoryBtn');
const restartBtn = document.getElementById('restartBtn');
const menuBtn = document.getElementById('menuBtn');
const drawer = document.getElementById('drawer');
const drawerBackdrop = document.getElementById('drawerBackdrop');
const closeDrawerBtn = document.getElementById('closeDrawerBtn');
const continueBtn = document.getElementById('continueBtn');
const drawerInventoryBtn = document.getElementById('drawerInventoryBtn');
const drawerRestartBtn = document.getElementById('drawerRestartBtn');
const modalBackdrop = document.getElementById('modalBackdrop');
const modal = document.getElementById('modal');
const closeModalBtn = document.getElementById('closeModalBtn');
const modalTitle = document.getElementById('modalTitle');
const modalContent = document.getElementById('modalContent');

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? { ...defaultState(), ...JSON.parse(saved) } : defaultState();
  } catch { return defaultState(); }
}
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    // Certains aperçus/lecteurs HTML bloquent le stockage local.
    // Le jeu reste jouable pendant la session.
  }
}

function enterNode(id) {
  const node = STORY[id];
  if (!node) return;
  state.node = id;
  if (!state.visited[id]) {
    state.visited[id] = true;
    if (typeof node.onEnter === 'function') node.onEnter(state);
  }
  state.history.push(id);
  saveState();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function loadPageImage(pageNumber, title) {
  const base = imageBaseForPage(pageNumber);
  imageLabel.textContent = base;
  storyImage.classList.add('hidden');
  imagePlaceholder.style.display = 'grid';
  storyImage.alt = title ? `Illustration — ${title}` : `Illustration page ${padPage(pageNumber)}`;

  let index = 0;
  const tryNext = () => {
    if (index >= IMAGE_EXTENSIONS.length) {
      storyImage.removeAttribute('src');
      storyImage.classList.add('hidden');
      imagePlaceholder.style.display = 'grid';
      return;
    }
    const ext = IMAGE_EXTENSIONS[index++];
    storyImage.onload = () => {
      storyImage.classList.remove('hidden');
      imagePlaceholder.style.display = 'none';
    };
    storyImage.onerror = tryNext;
    storyImage.src = `./images/${base}.${ext}`;
  };
  tryNext();
}

function render() {
  const node = STORY[state.node] || STORY.start;
  const pageNumber = PAGE_BY_NODE[state.node] || 1;
  chapterNumber.textContent = `PAGE ${padPage(pageNumber)}`;
  chapterTitle.textContent = node.title || '';
  loadPageImage(pageNumber, node.title || '');
  storyText.innerHTML = typeof node.text === 'function' ? node.text(state) : node.text;

  const itemCount = Object.keys(state.inventory).length;
  inventoryCount.textContent = itemCount;
  statusTags.innerHTML = '';
  if (itemCount) {
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = `${itemCount} objet${itemCount > 1 ? 's' : ''} dans l’inventaire`;
    statusTags.appendChild(tag);
  }
  if (node.ending) {
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = 'Fin découverte';
    statusTags.appendChild(tag);
  }

  const availableChoices = typeof node.choices === 'function' ? node.choices(state) : (node.choices || []);
  choices.innerHTML = '';
  availableChoices.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    const destinationPage = PAGE_BY_NODE[choice.to];
    const destination = destinationPage
      ? `<span class="choice-dest">Rendez-vous à la page ${padPage(destinationPage)}</span>`
      : '';
    btn.innerHTML = `<span class="choice-index">${i + 1}</span><span class="choice-copy"><span>${choice.label}</span>${destination}</span>`;
    btn.addEventListener('click', () => {
      if (typeof choice.effect === 'function') choice.effect(state);
      enterNode(choice.to);
    });
    choices.appendChild(btn);
  });

  if (node.ending) {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="choice-index">↻</span>Recommencer l’aventure`;
    btn.addEventListener('click', restartGame);
    choices.appendChild(btn);
  }
}

function restartGame() {
  // Redémarrage direct : window.confirm() est bloqué dans certains aperçus HTML.
  state = defaultState();
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (e) {}
  saveState();
  closeDrawer();
  closeModal();
  render();
  try {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    window.scrollTo(0, 0);
  }
}

function openInventory() {
  modalTitle.textContent = 'Inventaire';
  const items = Object.entries(state.inventory);
  modalContent.innerHTML = items.length
    ? `<div class="inventory-list">${items.map(([id,item]) => `<div class="inventory-item"><strong>${item.name}</strong><span>${item.description}</span></div>`).join('')}</div>`
    : `<div class="inventory-empty">Tu ne transportes encore aucun objet particulier.</div>`;
  modal.classList.remove('hidden');
  modalBackdrop.classList.remove('hidden');
}
function closeModal() {
  modal.classList.add('hidden');
  modalBackdrop.classList.add('hidden');
}
function openDrawer() {
  drawer.classList.add('open');
  drawer.setAttribute('aria-hidden','false');
  drawerBackdrop.classList.remove('hidden');
}
function closeDrawer() {
  drawer.classList.remove('open');
  drawer.setAttribute('aria-hidden','true');
  drawerBackdrop.classList.add('hidden');
}

inventoryBtn.addEventListener('click', openInventory);
restartBtn.addEventListener('click', restartGame);
menuBtn.addEventListener('click', openDrawer);
closeDrawerBtn.addEventListener('click', closeDrawer);
drawerBackdrop.addEventListener('click', closeDrawer);
continueBtn.addEventListener('click', closeDrawer);
drawerInventoryBtn.addEventListener('click', () => { closeDrawer(); openInventory(); });
drawerRestartBtn.addEventListener('click', restartGame);
closeModalBtn.addEventListener('click', closeModal);
modalBackdrop.addEventListener('click', closeModal);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeDrawer(); closeModal(); }
});

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

render();

  </script>
</body>
</html>
