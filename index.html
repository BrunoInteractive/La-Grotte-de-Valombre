<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#251e17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <meta name="apple-mobile-web-app-title" content="Valombre" />
  <meta name="application-name" content="La Grotte de Valombre" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="La Grotte de Valombre — livre-jeu interactif médiéval fantastique." />
  <title>La Grotte de Valombre — Livre-jeu</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:wght@500;600&display=swap');



:root {
  --desk: #1a1511;
  --desk2: #2a2119;
  --paper: #eadcb9;
  --paper-light: #f1e6cc;
  --paper-mid: #e6d5af;
  --paper-edge: #b79e72;
  --paper-edge-dark: #856a46;
  --ink: #1a1410;
  --ink-soft: #5a4938;
  --rule: #765c39;
  --rule-light: #c0a16a;
  --cartouche: #2d2017;
  --cartouche-light: #493527;
  --gold: #9b7a49;
  --danger: #71372f;
  --body-font: 'EB Garamond', Garamond, 'Times New Roman', serif;
  --display-font: 'Cormorant Garamond', Garamond, 'Times New Roman', serif;
}


* { box-sizing: border-box; }
html, 
body {
  margin: 0;
  color: var(--ink);
  font-family: var(--body-font);
  font-kerning: normal;
  font-variant-ligatures: common-ligatures;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(171,128,73,.11), transparent 42%),
    linear-gradient(180deg, var(--desk2), var(--desk));
}

button { font: inherit; }


.app-shell {
  min-height: 100vh;
  max-width: 1060px;
  margin: 0 auto;
  padding: max(12px, env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom));
}

.topbar {
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:16px;
  padding: 8px 6px 14px;
  color: #dcc79b;
}
.topbar h1 {
  margin: 0;
  font-family: var(--display-font);
  font-size: clamp(24px, 4.6vw, 34px);
  line-height: 1;
  font-weight: 600;
  letter-spacing: .01em;
}
.eyebrow {
  margin-bottom: 4px;
  font-family: var(--body-font);
  letter-spacing: .16em;
  font-size: 11px;
  color: #bea375;
}
.icon-btn {
  border: 1px solid rgba(180,153,109,.52);
  background: linear-gradient(180deg, rgba(73,55,38,.95), rgba(42,31,22,.95));
  color: #ead9b3;
  border-radius: 0;
  width: 42px;
  height: 42px;
  cursor: pointer;
  font-family: var(--body-font);
  font-size: 20px;
  box-shadow: inset 0 0 0 1px rgba(27,18,11,.45);
}



/* Page unique : on reproduit une page de livre-jeu imprimé, pas une interface web moderne. */
.game {
  position: relative;
  padding: 16px 16px 24px;
  border: 1px solid #89704b;
  background:
    radial-gradient(circle at 12% 18%, rgba(126,94,54,.035) 0 1.2px, transparent 1.9px),
    radial-gradient(circle at 76% 70%, rgba(126,94,54,.028) 0 1px, transparent 1.7px),
    linear-gradient(180deg, var(--paper-light), var(--paper-mid));
  box-shadow:
    0 0 0 2px rgba(102,79,48,.22),
    0 20px 52px rgba(0,0,0,.24);
}
.game .print-grain { display:none; }
.game::before,
.game::after {
  content:'';
  position:absolute;
  pointer-events:none;
}
.game::before {
  inset: 6px;
  border: 1px solid rgba(116,90,56,.62);
  box-shadow:
    inset 0 0 0 1px rgba(241,231,206,.92),
    inset 0 0 0 5px rgba(163,134,87,.10);
}
.game::after {
  inset: 0;
  background:
    linear-gradient(90deg, rgba(71,52,32,.13), transparent 2.1%, transparent 97.9%, rgba(71,52,32,.11)),
    linear-gradient(180deg, rgba(71,52,32,.09), transparent 2.2%, transparent 97.6%, rgba(71,52,32,.09));
  opacity: .55;
  mix-blend-mode: multiply;
}

.game::before {
  inset: 8px;
  border: 1px solid rgba(92,68,39,.72);
  outline: 1px solid rgba(163,133,85,.48);
  outline-offset: -4px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.17);
}
.game::after {
  inset: 0;
  opacity: .28;
  background:
    linear-gradient(90deg, rgba(64,43,24,.26), transparent 2.1%, transparent 97.6%, rgba(64,43,24,.20)),
    linear-gradient(180deg, rgba(64,43,24,.13), transparent 2.6%, transparent 97.2%, rgba(64,43,24,.13));
  mix-blend-mode: multiply;
}



.image-frame {
  position: relative;
  z-index: 2;
  aspect-ratio: 4/3;
  margin: 6px 6px 0;
  border: 1px solid #6e5739;
  background: #cab995;
  overflow: hidden;
  box-shadow:
    inset 0 0 0 1px rgba(245,235,211,.95),
    inset 0 0 0 4px rgba(104,82,52,.46);
}
.image-frame::after {
  content:'';
  position:absolute;
  inset:0;
  pointer-events:none;
  box-shadow:
    inset 0 0 0 6px rgba(236,225,198,.18),
    inset 0 0 20px rgba(26,18,12,.10);
}
.story-image { width:100%; height:100%; display:block; object-fit:cover; object-position:center; }
.story-image.hidden { display:none; }
.image-placeholder {
  width:100%; height:100%;
  display:grid;
  place-content:center;
  gap:8px;
  text-align:center;
  background: linear-gradient(180deg, #d7c5a3, #cfbb94);
  color:#5e4c37;
  font-family:var(--body-font);
}
.image-placeholder span { font-size:13px; letter-spacing:.06em; }
.image-placeholder small { font-size:11px; letter-spacing:.02em; opacity:.9; }





.story-card {
  position:relative;
  z-index:2;
  margin: 18px 18px 0;
  padding: 0 26px 0;
  background: transparent;
  border: 0;
}
.chapter-number {
  display:block;
  margin: 0 0 8px;
  color:#6a563c;
  font-family:var(--body-font);
  font-size:14px;
  letter-spacing:.02em;
  text-align:right;
}
.story-card h2 {
  margin: 0 0 16px;
  text-align:center;
  color:#221912;
  font-family:var(--display-font);
  font-size: clamp(40px, 6vw, 58px);
  line-height: 1;
  font-weight: 600;
  letter-spacing: 0;
}
.story-card h2::after { content:none; }




.story-text {
  max-width: 860px;
  margin: 0 auto;
  color:#19130f;
  font-family:var(--body-font);
  font-size: clamp(21px, 2.65vw, 25px);
  line-height: 1.22;
  font-weight: 500;
  letter-spacing: -.004em;
  text-align: left;
  hyphens: none;
}
.story-text p {
  margin: 0 0 .28em;
  text-indent: 0;
}
.story-text p:first-child { text-indent:0; }
.story-text p:first-child::first-letter {
  float:none;
  margin:0;
  color:inherit;
  font-family:inherit;
  font-size:inherit;
  line-height:inherit;
}




.story-text blockquote {
  margin: .9em 0;
  padding: 0;
  border: 0;
  color:#2f2419;
  font-style: italic;
  text-align:center;
  background:none;
}


.story-text ul { padding-left:1.25em; }
.story-text .ending {
  margin:27px auto 0;
  padding:13px 14px;
  border-top:4px double #826846;
  border-bottom:4px double #826846;
  text-align:center;
  color:#563923;
  font-family:var(--display-font);
  font-weight:600;
  letter-spacing:.10em;
}


.status-tags {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  margin: 15px 0 0;
}
.tag {
  border:1px solid rgba(122,96,60,.48);
  background: rgba(255,255,255,.08);
  color:#5f4730;
  padding: 4px 9px;
  font-family:var(--body-font);
  font-size:13px;
}



/* Cartouches de choix : inspirés d'une maquette de livre imprimé, pas d'une UI moderne. */
.choices {
  position:relative;
  display:grid;
  grid-template-columns:repeat(2, minmax(0,1fr));
  gap: 20px;
  margin: 22px auto 6px;
  padding-top: 4px;
  max-width: 860px;
}
.choice-btn {
  position:relative;
  display:flex;
  align-items:stretch;
  width:100%;
  min-height:140px;
  border:1px solid #896d48;
  background: linear-gradient(180deg, #efe2c3, #ecdcbc);
  color:var(--ink);
  padding: 18px 18px 54px;
  border-radius:0;
  cursor:pointer;
  box-shadow:
    inset 0 0 0 1px rgba(243,234,212,.98),
    inset 0 0 0 4px rgba(121,95,62,.28);
  transition:none;
}
.choice-btn::before,
.choice-btn::after {
  content:'';
  position:absolute;
  width:14px;
  height:14px;
  border-color:#a18255;
}
.choice-btn::before {
  left:8px;
  top:8px;
  border-left:1px solid;
  border-top:1px solid;
}
.choice-btn::after {
  right:8px;
  top:8px;
  border-right:1px solid;
  border-top:1px solid;
}
.choice-btn:hover { filter:none; transform:none; }
.choice-copy {
  display:flex;
  flex:1;
  flex-direction:column;
  justify-content:center;
  text-align:center;
  font-family:var(--body-font);
  font-size:20px;
  line-height:1.18;
  font-weight:500;
}
.choice-dest {
  position:absolute;
  left:8px;
  right:8px;
  bottom:8px;
  min-height:36px;
  display:grid;
  place-items:center;
  padding: 6px 10px;
  border:1px solid #20160f;
  background: linear-gradient(180deg, #453125, #2b2018);
  color:#efdfbd;
  font-family:var(--body-font);
  font-size:17px;
  font-weight:600;
  letter-spacing:0;
}
.choice-dest::before,
.choice-dest::after { content:''; margin:0; }
.choice-btn:only-child,
.choice-btn:last-child:nth-child(odd) {
  grid-column:1 / -1;
  max-width:390px;
  justify-self:center;
}




.footer {
  position: static;
  width: min(860px,100%);
  margin: 16px auto 0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:0;
  background:none;
}
.footer-btn, .drawer-action {
  border:1px solid rgba(166,136,93,.58);
  background: linear-gradient(180deg, #4e3929, #2b1f17);
  color:#efe0ba;
  padding: 11px 13px;
  border-radius:0;
  cursor:pointer;
  font-family:var(--body-font);
  font-size:15px;
  box-shadow: inset 0 0 0 1px rgba(30,21,15,.5);
}
.footer-btn span {
  display:inline-grid;
  place-items:center;
  min-width:20px;
  height:20px;
  margin-left:4px;
  background:#b99762;
  color:#1e1710;
  font-size:11px;
  font-weight:700;
}

.danger { color:#e5c1b4; }

.backdrop { position:fixed; inset:0; background:rgba(0,0,0,.61); backdrop-filter:blur(3px); z-index:30; }
.hidden { display:none !important; }

.drawer {
  position:fixed;
  top:0;
  right:0;
  width:min(360px,88vw);
  height:100%;
  z-index:40;
  color:var(--ink);
  background:linear-gradient(180deg, #efe2c0, #e2cf9f);
  border-left:1px solid #7b6546;
  padding:max(18px,env(safe-area-inset-top)) 18px 18px;
  transform:translateX(102%);
  transition:transform .2s ease;
  box-shadow:-16px 0 38px rgba(0,0,0,.34);
}
.drawer.open { transform:translateX(0); }
.drawer-head { display:flex; justify-content:space-between; align-items:center; gap:12px; }
.drawer-head h3 { margin:0; font-family:var(--display-font); font-size:30px; font-weight:600; }
.drawer .icon-btn,.modal .icon-btn { color:#34271b; background:transparent; border-color:#8b7452; box-shadow:none; }
.drawer-action { display:block; width:100%; text-align:left; margin-top:12px; background:rgba(83,61,39,.08); color:#392b1f; border-color:#907552; }
.drawer-note { margin-top:22px; color:#6b5a45; font:14px/1.4 var(--body-font); }
.danger-text { color:#793f36; }


.modal { position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:18px; }

.modal-card {
  width:min(520px,100%);
  max-height:80vh;
  overflow:auto;
  color:var(--ink);
  background:linear-gradient(180deg, #f1e5c4, #e5d3a9);
  border:1px solid #806847;
  border-radius:0;
  padding:18px;
  box-shadow:0 18px 40px rgba(0,0,0,.32);
}
.inventory-list { display:grid; gap:10px; margin-top:16px; }
.inventory-item { padding:12px; border:1px solid #987d57; background:rgba(255,255,255,.14); }
.inventory-item strong { display:block; color:#6c4a2e; margin-bottom:4px; }
.inventory-empty { color:#6b5a45; margin-top:14px; }



@media (max-width:620px) {
  .app-shell { padding-left:10px; padding-right:10px; }
  .topbar { padding-left:2px; padding-right:2px; }
  .topbar h1 { font-size:26px; }
  .game { padding: 12px 12px 20px; box-shadow: 0 14px 36px rgba(0,0,0,.24); }
  .game::before { inset: 5px; }
  .image-frame { margin: 4px 4px 0; }
  .story-card { margin: 14px 10px 0; padding:0 8px; }
  .chapter-number { font-size:13px; }
  .story-card h2 { font-size: 32px; margin-bottom: 12px; }
  .story-text { font-size: 18px; line-height: 1.22; }
  .choices { grid-template-columns:1fr; gap:12px; }
    .choice-btn { min-height: 120px; padding: 14px 12px 48px; }
  .choice-copy { font-size: 17px; }
  .choice-dest { font-size: 15px; min-height: 32px; }
  .footer { grid-template-columns:1fr 1fr; }
}



  .choices { grid-template-columns:1fr; gap:12px; margin-top:27px; }
  .choice-btn { min-height:116px; }
  .choice-copy { font-size:17px; }
}

  
/* =========================================================
   AJOUTS FONCTIONNELS — le design principal des pages reste intact.
   ========================================================= */

.footer {
  grid-template-columns: repeat(3, 1fr);
}

.hero-sheet {
  max-width: 690px;
  margin: 0 auto 18px;
  padding: 16px;
  border: 1px solid #927653;
  background: rgba(255,255,255,.10);
  box-shadow: inset 0 0 0 3px rgba(126,94,56,.07);
}

.hero-sheet-row {
  display:grid;
  grid-template-columns: 125px 1fr;
  gap:14px;
  padding:7px 0;
  border-bottom:1px solid rgba(103,77,46,.22);
}

.hero-label {
  color:#65492f;
  font-variant:small-caps;
  letter-spacing:.05em;
}

.hero-value {
  color:#21170f;
}

.hero-name-input {
  width:100%;
  border:0;
  border-bottom:1px solid #806442;
  border-radius:0;
  outline:none;
  padding:3px 2px 5px;
  background:transparent;
  color:#21170f;
  font-family:var(--body-font);
  font-size:19px;
}

.hero-sheet-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-top:14px;
}

.hero-stat {
  display:flex;
  justify-content:space-between;
  gap:12px;
  border:1px solid #9a7e58;
  padding:9px 11px;
  background:rgba(255,255,255,.08);
}

.hero-stat strong {
  color:#694a2e;
}

.hero-weapon {
  margin-top:12px;
  text-align:center;
  color:#49331f;
  font-style:italic;
}

.parchment-verse {
  max-width:650px;
  margin:18px auto;
  padding:14px 18px;
  border-top:1px solid #94764f;
  border-bottom:1px solid #94764f;
  text-align:center;
  color:#342419;
  font-style:italic;
  background:rgba(255,255,255,.07);
}

.weapon-compare {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:16px 0;
}

.weapon-compare > div {
  border:1px solid #9a7e58;
  padding:11px;
  background:rgba(255,255,255,.08);
  text-align:center;
}

.inventory-topline {
  margin:12px 0 4px;
  color:#6c5338;
  font-style:italic;
}

.inventory-item p {
  margin:.25em 0 0;
}

.inventory-actions {
  margin-top:10px;
}

.inventory-action-btn {
  width:100%;
  border:1px solid rgba(224,205,164,.36);
  outline:1px solid rgba(69,49,31,.75);
  outline-offset:-4px;
  background:linear-gradient(180deg, #57432f, #35281d);
  color:#efe1bd;
  padding:10px 12px;
  border-radius:1px;
  cursor:pointer;
  font-family:var(--body-font);
  font-size:14px;
}

.inventory-action-btn:disabled {
  opacity:.42;
  cursor:default;
}

.inventory-parchment-image {
  display:block;
  width:100%;
  max-width:430px;
  margin:12px auto 16px;
  border:1px solid #806746;
}

.inventory-image-fallback {
  display:none;
  padding:14px;
  margin:12px 0;
  border:1px dashed #96784f;
  color:#725739;
  text-align:center;
}

.journal-panel {
  position:fixed;
  left:16px;
  bottom:16px;
  z-index:70;
  width:min(390px,calc(100vw - 32px));
  max-height:68vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border:1px solid #765d3d;
  background:
    radial-gradient(circle at 18% 14%, rgba(101,72,39,.035) 0 1px, transparent 1.8px),
    linear-gradient(180deg,#efe2c0,#e1cda2);
  box-shadow:0 18px 45px rgba(0,0,0,.36);
  color:#251a11;
}

.journal-panel.hidden {
  display:none !important;
}

.journal-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:10px 12px 8px;
  border-bottom:3px double #9b7b50;
}

.journal-head h3 {
  margin:0;
  font-family:var(--display-font);
  font-size:28px;
  font-weight:600;
}

.journal-close {
  width:34px;
  height:34px;
  border:1px solid #8a6e48;
  border-radius:0;
  background:transparent;
  color:#382819;
  font-size:21px;
  cursor:pointer;
}

.journal-body {
  padding:11px 12px 13px;
  overflow:auto;
}

.journal-hint {
  margin:0 0 9px;
  color:#665039;
  font-size:14px;
  line-height:1.28;
  font-style:italic;
}

.journal-textarea {
  width:100%;
  min-height:300px;
  resize:vertical;
  border:1px solid #876943;
  border-radius:0;
  outline:none;
  padding:14px;
  color:#251a11;
  font-family:var(--body-font);
  font-size:17px;
  line-height:1.42;
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(120,91,54,.12) 0,
      rgba(120,91,54,.12) 1px,
      transparent 1px,
      transparent 28px
    ),
    rgba(244,230,198,.52);
}

.journal-status {
  margin-top:7px;
  text-align:right;
  color:#735b3f;
  font-size:11px;
  font-style:italic;
}

@media (max-width:620px) {
  .footer {
    grid-template-columns:repeat(3,1fr);
    gap:6px;
  }

  .footer-btn {
    padding-left:5px;
    padding-right:5px;
    font-size:12px;
  }

  .hero-sheet-row {
    grid-template-columns:1fr;
    gap:3px;
  }

  .hero-sheet-grid,
  .weapon-compare {
    grid-template-columns:1fr;
  }

  .journal-panel {
    left:8px;
    right:8px;
    bottom:8px;
    width:auto;
    max-height:72vh;
  }

  .journal-textarea {
    min-height:260px;
    font-size:17px;
  }
}


.combat-result {
  margin: 14px 0 18px;
  padding: 10px 14px;
  border-top: 1px solid #927653;
  border-bottom: 1px solid #927653;
  text-align: center;
  background: rgba(255,255,255,.07);
}
.combat-result p {
  margin: 3px 0;
}

.dice-result {
  margin:16px 0 20px;
  padding:12px 14px;
  border-top:1px solid #927653;
  border-bottom:1px solid #927653;
  text-align:center;
  background:rgba(255,255,255,.07);
}
.dice-faces {
  display:flex;
  justify-content:center;
  gap:14px;
  margin-bottom:8px;
}
.dice-faces span {
  font-size:44px;
  line-height:1;
}
.dice-result p { margin:3px 0; }

.dice-faces {
  display:flex;
  justify-content:center;
  gap:16px;
  margin-bottom:10px;
}

.die-visual {
  width:58px;
  height:58px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);
  padding:6px;
  border:1px solid #5f4931;
  border-radius:7px;
  background:#eee0bd;
  box-shadow:
    inset 0 0 0 2px rgba(92,68,42,.12),
    0 2px 5px rgba(35,24,14,.18);
}

.die-cell {
  display:grid;
  place-items:center;
}

.die-cell i {
  display:block;
  width:9px;
  height:9px;
  border-radius:50%;
  background:#2e2117;
}

.dice-values {
  font-size:14px;
  color:#60482f;
}

</style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">LIVRE-JEU INTERACTIF</div>
        <h1>La Grotte de Valombre</h1>
      </div>
      <button id="menuBtn" class="icon-btn" aria-label="Ouvrir le menu">☰</button>
    </header>

    <main id="game" class="game" aria-live="polite" data-design="livre-jeu-80s">
      <section class="image-frame" id="imageFrame">
        <img id="storyImage" class="story-image hidden" alt="" />
        <div class="image-placeholder" id="imagePlaceholder">
          <span>IMAGE À VENIR</span>
          <small id="imageLabel">La-Grotte-de-Valombre-01</small>
        </div>
      </section>

      <section class="story-card">
        <div class="chapter-number" id="chapterNumber"></div>
        <h2 id="chapterTitle"></h2>
        <div id="storyText" class="story-text"></div>
        <div id="statusTags" class="status-tags"></div>
        <div id="choices" class="choices"></div>
      </section>
    </main>

    <footer class="footer">
      <button id="inventoryBtn" class="footer-btn">Inventaire <span id="inventoryCount">0</span></button>
      <button id="journalBtn" class="footer-btn">Journal</button>
      <button id="restartBtn" class="footer-btn danger">Recommencer</button>
    </footer>
  </div>


  <aside id="journalPanel" class="journal-panel hidden" aria-hidden="true">
    <div class="journal-head">
      <h3>Journal</h3>
      <button id="journalCloseBtn" class="journal-close" type="button" aria-label="Fermer le journal">×</button>
    </div>
    <div class="journal-body">
      <p class="journal-hint">Écris librement, ou copie-colle ici un passage important de l’histoire.</p>
      <textarea id="journalText" class="journal-textarea" spellcheck="true"
        placeholder="Indices, hypothèses, détails à retenir…"></textarea>
      <div id="journalStatus" class="journal-status">Sauvegarde automatique</div>
    </div>
  </aside>

  <div id="drawerBackdrop" class="backdrop hidden"></div>
  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h3>Menu</h3>
      <button id="closeDrawerBtn" class="icon-btn">×</button>
    </div>
    <button id="continueBtn" class="drawer-action">Continuer la partie</button>
    <button id="drawerInventoryBtn" class="drawer-action">Voir l’inventaire</button>
    <button id="drawerRestartBtn" class="drawer-action danger-text">Recommencer depuis le début</button>
    <div class="drawer-note">La progression est sauvegardée automatiquement sur cet appareil.</div>
  </aside>

  <div id="modalBackdrop" class="backdrop hidden"></div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="drawer-head">
        <h3 id="modalTitle">Inventaire</h3>
        <button id="closeModalBtn" class="icon-btn">×</button>
      </div>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
const STORY = {
  start: {
    sheet: true,
    number: 'FICHE DU HÉROS',
    title: 'Ton personnage',
    text: state => `
      <div class="hero-sheet">
        <div class="hero-sheet-row">
          <span class="hero-label">Nom</span>
          <input id="heroNameInput" class="hero-name-input" type="text" maxlength="24"
            placeholder="Ton nom" value="${escapeHtml(state.heroName || '')}">
        </div>
        <div class="hero-sheet-row"><span class="hero-label">Rang</span><span class="hero-value">Écuyer de Sir Aldren de Rochebrune</span></div>
        <div class="hero-sheet-row"><span class="hero-label">Style</span><span class="hero-value">Vif, prudent et observateur</span></div>
        <div class="hero-sheet-row"><span class="hero-label">Technique de bataille</span><span class="hero-value">Esquive, déplacement rapide et contre-attaque</span></div>

        <div class="hero-sheet-grid">
          <div class="hero-stat"><strong>Vie</strong><span>${state.hp} / ${state.maxHp}</span></div>
          <div class="hero-stat"><strong>Chance</strong><span>${state.chance} / 12</span></div>
          <div class="hero-stat"><strong>Force</strong><span>${currentForce(state)} / 12</span></div>
          <div class="hero-stat"><strong>Dextérité</strong><span>${currentDexterity(state)} / 12</span></div>
          <div class="hero-stat"><strong>Puissance</strong><span>${combatPower(state)}</span></div>
        </div>

        <div class="hero-weapon">Au départ, tu ne portes encore aucune arme.</div>
      </div>
      <p>Sir Aldren t’a ordonné de rester au village. Pourtant, la nuit est tombée depuis longtemps et son cheval vient de revenir seul.</p>
    `,
    choices: [{ label: 'Commencer l’aventure', to: 'c1' }]
  },

  c1: {
    number: 'PAGE 1',
    title: 'Le cheval revenu seul',
    image: 'Le cheval revenu seul',
    text: state => `
      <p>Des sabots résonnent soudain sur les pavés de Valombre.</p>
      <p>Le cheval de <strong>Sir Aldren de Rochebrune</strong> apparaît au bout de la rue. Seul.</p>
      <p>De l’écume couvre son poitrail. Une longue entaille traverse la selle et du sang séché macule l’une des sacoches.</p>
      <p>Dans l’écurie, contre le mur, repose encore l’ancienne épée de ton maître. Une arme solide, mais beaucoup trop lourde pour toi.</p>
      <p>Personne ne te demande de partir à sa recherche. Personne ne te l’interdit non plus.</p>
    `,
    choices: [
      { label: 'Fouiller la sacoche de Sir Aldren', to: 'c2' },
      { label: 'Partir au village demander de l’aide', to: 'c3', effect: s => equipHeavySword(s) },
      { label: 'Prendre l’épée et partir immédiatement vers les grottes', to: 'c8', effect: s => equipHeavySword(s) }
    ]
  },

  c2: {
    number: 'PAGE 2',
    title: 'La sacoche de Sir Aldren',
    image: 'La sacoche de Sir Aldren',
    onEnter: s => {
      if (!s.flags.sacocheFouillee) {
        s.flags.sacocheFouillee = true;
        s.silver += 3;
        addItem(
          s,
          'parchemin',
          'Parchemin ancien',
          'Un fragment ancien découvert dans les affaires de Sir Aldren. Il peut être relu quand tu veux.'
        );
      }
    },
    text: state => `
      <p>Tu ouvres la sacoche. À l’intérieur, tu trouves <strong>trois pièces d’argent</strong>, une petite <strong>fiole rouge sombre</strong> et un morceau de parchemin plié plusieurs fois.</p>
      <p>Le papier paraît beaucoup plus ancien que le reste. Certaines lettres sont presque effacées.</p>

      <div class="parchment-verse">
        <strong>L’œil qui dort doit demeurer fermé,</strong><br>
        <strong>Car nul vivant ne doit le réveiller.</strong><br><br>
        <strong>Là où le soufre vient empoisonner l’air,</strong><br>
        <strong>Détourne tes pas et rebrousse en arrière.</strong><br><br>
        <strong>Lorsque les liens ne pourront plus céder,</strong><br>
        <strong>Cherche la lame noire : elle seule peut libérer.</strong>
      </div>

      <p>Tu plies soigneusement le parchemin et le ranges dans ton inventaire. Tu pourras désormais le relire quand tu le souhaites.</p>
      ${hasItem(state,'fiole_rouge') || state.flags.fioleLaissee
        ? '<p>Tu as déjà décidé quoi faire de la mystérieuse fiole rouge.</p>'
        : '<p>La fiole rouge reste entre tes mains. Tu ignores encore ce qu’elle contient.</p>'}
    `,
    choices: state => {
      if (!hasItem(state,'fiole_rouge') && !state.flags.fioleLaissee) {
        return [
          { label: 'Prendre la fiole et aller au village', to: 'c3', effect: s => { addItem(s,'fiole_rouge','Fiole rouge','Une petite fiole au liquide rouge sombre. Son utilité est encore inconnue.'); equipHeavySword(s); } },
          { label: 'Prendre la fiole et partir vers les grottes', to: 'c8', effect: s => { addItem(s,'fiole_rouge','Fiole rouge','Une petite fiole au liquide rouge sombre. Son utilité est encore inconnue.'); equipHeavySword(s); } },
          { label: 'Laisser la fiole et aller au village', to: 'c3', effect: s => { s.flags.fioleLaissee = true; equipHeavySword(s); } },
          { label: 'Laisser la fiole et partir vers les grottes', to: 'c8', effect: s => { s.flags.fioleLaissee = true; equipHeavySword(s); } }
        ];
      }
      return [
        { label: 'Aller au village', to: 'c3', effect: s => equipHeavySword(s) },
        { label: 'Partir vers les grottes', to: 'c8', effect: s => equipHeavySword(s) }
      ];
    }
  },

  c3: {
    number: 'PAGE 3',
    title: 'La place de Valombre',
    image: 'La place de Valombre',
    onEnter: s => equipHeavySword(s),
    text: `
      <p>La place de Valombre est presque déserte. Les volets se ferment les uns après les autres.</p>
      <p>Sous son auvent, le <strong>marchand</strong> termine de ranger ses affaires. Dans la forge, une lueur rouge éclaire encore les murs.</p>
      <p>Plus loin, dans l’ombre d’une ruelle, une étrange silhouette semble parler toute seule.</p>
      <p>Tu peux rencontrer qui tu veux — ou quitter le village immédiatement.</p>
    `,
    choices: [
      { label: 'Voir le marchand', to: 'c4' },
      { label: 'Voir le forgeron', to: 'c5' },
      { label: 'Approcher la personne dans la ruelle', to: 'c6' },
      { label: 'Partir vers la grotte', to: 'c8' }
    ]
  },

  c4: {
    number: 'PAGE 4',
    title: 'Le marchand',
    image: 'Le marchand de Valombre',
    text: state => {
      if (hasItem(state,'potion_guerison')) {
        return `
          <p>Le marchand reconnaît la potion qui dépasse de ton sac.</p>
          <blockquote>« Garde-la pour le moment où tu en auras vraiment besoin. »</blockquote>
        `;
      }
      if (state.silver >= 3) {
        return `
          <p>Le marchand t’écoute raconter le retour du cheval. Son visage devient grave.</p>
          <p>Il sort alors d’une petite caisse une fiole soigneusement bouchée.</p>
          <blockquote>« Une potion de guérison. Elle rendra jusqu’à <strong>2 points de vie</strong>. Trois pièces d’argent. »</blockquote>
        `;
      }
      return `
        <p>Le marchand fouille rapidement ses étagères, puis secoue la tête.</p>
        <blockquote>« Sans argent, je ne peux rien faire pour toi, mon ami. Reviens quand tu auras de quoi payer. »</blockquote>
      `;
    },
    choices: state => {
      if (!hasItem(state,'potion_guerison') && state.silver >= 3) {
        return [
          {
            label: 'Acheter la potion de guérison',
            to: 'c3',
            effect: s => {
              s.silver -= 3;
              addItem(
                s,
                'potion_guerison',
                'Potion de guérison',
                'Une potion achetée au marchand. Elle peut être utilisée à tout moment pour récupérer 2 points de vie.'
              );
            }
          },
          { label: 'Ne rien acheter et repartir', to: 'c3' }
        ];
      }
      return [{ label: 'Retourner sur la place', to: 'c3' }];
    }
  },

  c5: {
    number: 'PAGE 5',
    title: 'Le forgeron',
    image: 'Le forgeron de Valombre',
    text: state => `
      <p>Le forgeron lève immédiatement les yeux lorsque tu entres.</p>

      <blockquote>« Toi ? Où est Aldren ? »</blockquote>

      <p>Lorsqu’il apprend ce qui s’est passé, son visage se ferme.</p>

      <p>Il connaissait ton maître depuis des années.</p>

      <blockquote>« J’irais avec toi si je le pouvais. Mais ma jambe ne me mènerait même pas jusqu’au pied de la montagne. »</blockquote>

      <p>Son regard tombe alors sur l’ancienne épée de Sir Aldren.</p>

      <p>Il sourit légèrement.</p>

      <blockquote>« Cette chose ? Aldren maniait ça comme une brindille. Toi, elle va te faire tomber avant ton adversaire. »</blockquote>

      <p>Il disparaît dans l’arrière-boutique et revient avec une lame plus courte, parfaitement équilibrée.</p>

      <blockquote>« Je te propose un échange. Elle frappe moins fort… mais entre de bonnes mains, elle frappe beaucoup plus vite. »</blockquote>

      <div class="weapon-compare">
        <div>
          <strong>Garder l’épée lourde</strong><br><br>
          <strong>Épée de Sir Aldren</strong><br>
          Puissance : <strong>10</strong><br>
          Dextérité : <strong>6</strong>
        </div>
        <div>
          <strong>Accepter l’échange</strong><br><br>
          <strong>Épée du forgeron</strong><br>
          Puissance : <strong>4</strong><br>
          Dextérité : <strong>11</strong>
        </div>
      </div>
    `,
    choices: state => {
      if (state.weapon === 'light') {
        return [
          { label: 'Remercier le forgeron et retourner sur la place', to: 'c3' }
        ];
      }
      return [
        {
          label: 'Accepter l’échange',
          to: 'c3',
          effect: s => { s.weapon = 'light'; }
        },
        {
          label: 'Garder l’épée lourde de Sir Aldren',
          to: 'c3',
          effect: s => { s.weapon = 'heavy'; }
        }
      ];
    }
  },

  c6: {
    number: 'PAGE 6',
    title: 'La silhouette dans la ruelle',
    image: 'La silhouette dans la ruelle',
    text: `
      <p>Tu t’approches de la personne étrangement accoudée contre le mur.</p>
      <p>Elle semble parler seule, marmonnant quelque chose dans sa barbe. Sa silhouette est si maigre qu’elle paraît presque déformée.</p>
      <p>Plus tu avances, plus une odeur particulière devient nette.</p>
      <p><strong>Du soufre.</strong></p>
    `,
    choices: [
      { label: 'S’approcher encore davantage', to: 'c7' },
      { label: 'Repartir vers la place', to: 'c3' }
    ]
  },

  c7: {
    number: 'PAGE 7',
    title: 'Ils arrivent',
    image: 'Les yeux du fou',
    onEnter: s => { s.flags.avertissementSoufre = true; },
    text: `
      <p>Tu avances encore.</p>

      <p>La silhouette s’immobilise.</p>

      <p>Puis sa tête se tourne brusquement vers toi.</p>

      <p>Son visage est presque humain.</p>

      <p><em>Presque.</em></p>

      <p>Sa peau semble trop pâle. Ses joues trop creuses.</p>

      <p>Et ses yeux sont si largement ouverts que tu distingues le blanc tout autour de ses pupilles.</p>

      <p>Il recule contre le mur.</p>

      <blockquote>« Recule… »</blockquote>

      <p>Sa voix tremble.</p>

      <blockquote>« Recule si tu ne veux pas mourir… »</blockquote>

      <p>Il fixe quelque chose derrière toi.</p>

      <blockquote>« Ils arrivent. »</blockquote>

      <p>Puis il se met à rire.</p>

      <p>Un rire étouffé, presque douloureux.</p>

      <blockquote>« Vous ne voyez donc pas ? »</blockquote>

      <p>Son regard revient vers toi.</p>

      <blockquote><strong>« Ils arrivent… »</strong></blockquote>

      <p>Et soudain, quelque chose remue sous la peau de son cou.</p>
    `,
    choices: [
      { label: 'Reculer lentement et retourner sur la place', to: 'c3' },
      { label: 'Quitter Valombre et partir vers la grotte', to: 'c8' }
    ]
  },

  c8: {
    number: 'PAGE 8',
    title: 'Le chemin de la montagne',
    image: 'Le chemin de la montagne',
    text: `
      <p>Tu quittes Valombre.</p>

      <p>À mesure que tu t’éloignes du village, les dernières lumières disparaissent derrière les arbres.</p>

      <p>Le chemin monte lentement vers les collines.</p>

      <p>Au bout d’une demi-heure, la lune apparaît entre deux masses de nuages et éclaire brièvement le sentier.</p>

      <p>C’est alors que tu aperçois quelque chose sur le bas-côté.</p>

      <p>Un homme est étendu dans l’herbe.</p>

      <p>Quelques mètres plus loin, le chemin se divise.</p>

      <p>Le sentier principal continue de monter vers la montagne et l’entrée des grottes.</p>

      <p>L’autre chemin descend vers la forêt.</p>

      <p>Dans la boue, plusieurs <strong>traces de bottes</strong> s’éloignent dans cette direction.</p>
    `,
    choices: [
      { label: 'T’approcher du cadavre', to: 'c9' },
      { label: 'Continuer directement vers la grotte', to: 'c20' },
      { label: 'Suivre les traces de bottes vers la forêt', to: 'c14' }
    ]
  },

  c9: {
    number: 'PAGE 9',
    title: 'L’homme au bord du chemin',
    image: 'L’homme au bord du chemin',
    text: `
      <p>Tu t’approches lentement.</p>

      <p>À quelques pas du corps, tu reconnais les vêtements.</p>

      <p>Puis le visage.</p>

      <p>Ou plutôt ce qu’il en reste.</p>

      <p>C’est <strong>Gaspard Vellin</strong>, un marchand de Rochebrume, le village situé de l’autre côté de la forêt.</p>

      <p>Tu l’as déjà croisé plusieurs fois sur les marchés de Valombre. Un homme bruyant, toujours souriant, qui vendait aussi bien des étoffes que des outils ou des remèdes.</p>

      <p>Il est presque méconnaissable.</p>

      <p>Quelque chose semble avoir tiré ses traits vers le bas.</p>

      <p>Sa peau ne paraît ni brûlée, ni véritablement blessée. Pourtant son visage donne l’impression étrange d’avoir <strong>coulé autour de ses os</strong>, comme de la cire trop longtemps exposée à une flamme.</p>

      <p>Ses joues pendent mollement.</p>

      <p>Ses lèvres sont distendues.</p>

      <p>Et ses yeux, à demi ouverts, ne semblent plus regarder dans la même direction.</p>

      <p>Une odeur te parvient.</p>

      <p><strong>Du soufre.</strong></p>

      <p>Elle n’est pas seulement présente dans l’air.</p>

      <p>Elle paraît venir de lui.</p>

      <p>De ses vêtements.</p>

      <p>De sa peau.</p>

      <p>Peut-être même de l’intérieur de son corps.</p>

      <p>Tu te penches légèrement.</p>

      <p>Sa bouche est entrouverte.</p>

      <p>Quelque chose de noir emplit sa gorge.</p>

      <p>De la terre.</p>

      <p>Une terre sombre et humide, tassée entre ses dents jusque derrière sa langue.</p>

      <p>Pendant un instant, une pensée absurde te traverse : ce n’est peut-être pas de la terre qu’on lui a mise dans la bouche.</p>

      <p>Peut-être qu’elle est remontée de l’intérieur.</p>

      <p>Tu chasses immédiatement cette idée.</p>

      <p>Puis tu remarques sa main droite.</p>

      <p>Ses ongles sont cassés.</p>

      <p>Sous chacun d’eux se trouve la même terre noire.</p>

      <p>Comme s’il avait essayé de creuser quelque chose.</p>

      <p>Ou d’en sortir.</p>

      <p>Tu restes immobile.</p>

      <p>Tu ne saurais dire pourquoi, mais tu as soudain la certitude désagréable que <strong>Gaspard Vellin n’est peut-être pas mort</strong>.</p>
    `,
    choices: [
      { label: 'T’approcher encore et l’examiner', to: 'c10' },
      { label: 'T’éloigner et continuer vers la grotte', to: 'c20' },
      { label: 'Partir vers la forêt', to: 'c14' }
    ]
  },

  c10: {
    number: 'PAGE 10',
    title: 'Le dernier réflexe',
    image: 'Le dernier réflexe',
    text: `
      <p>Tu t’accroupis à côté de lui.</p>

      <p>Rien.</p>

      <p>Pas de respiration.</p>

      <p>Pas de mouvement.</p>

      <p>Tu avances lentement une main vers son cou.</p>

      <p>Ses doigts se referment brutalement autour de ton poignet.</p>

      <p>Tu étouffes un cri.</p>

      <p>Les yeux de Gaspard s’ouvrent entièrement.</p>

      <p>Ils sont injectés de sang.</p>

      <p>Mais ce n’est pas la douleur que tu y vois.</p>

      <p>C’est de la <strong>terreur</strong>.</p>

      <p>Une terreur si entière que, pendant une seconde, tu oublies même de dégager ton bras.</p>

      <p>Sa bouche s’entrouvre.</p>

      <p>La terre noire craque entre ses dents.</p>
    `,
    choices: [
      { label: 'Lui asséner un coup de pommeau avec ton épée', to: 'c11' },
      { label: 'Essayer de lui parler', to: 'c12' }
    ]
  },

  c11: {
    number: 'PAGE 11',
    title: 'Le coup',
    image: 'Le coup',
    text: `
      <p>Tu tires brusquement ton bras et frappes.</p>

      <p>Le pommeau de ton épée heurte sa tempe.</p>

      <p>Le son qui accompagne le choc n’est pas celui auquel tu t’attendais.</p>

      <p>Ce n’est pas véritablement le craquement d’un os.</p>

      <p>C’est un bruit mat et sec.</p>

      <p>Comme une branche morte que l’on brise contre une pierre.</p>

      <p>Le crâne de Gaspard heurte le sol.</p>

      <p>Son corps se détend immédiatement.</p>

      <p>Quelque chose s’écoule lentement de son nez.</p>

      <p>Ce n’est pas du sang.</p>

      <p>La matière est noire, granuleuse.</p>

      <p>Elle ressemble encore à de la terre.</p>

      <p>Tu recules d’un pas.</p>

      <p>Il ne bouge plus.</p>
    `,
    choices: [
      { label: 'Fouiller le corps de Gaspard Vellin', to: 'c13' },
      { label: 'Continuer vers la grotte', to: 'c20' },
      { label: 'Partir vers la forêt', to: 'c14' }
    ]
  },

  c12: {
    number: 'PAGE 12',
    title: 'Une voix sous la terre',
    image: 'Une voix sous la terre',
    onEnter: s => {
      s.hp = Math.max(0, s.hp - 1);
      s.dexPenalty = Math.min(4, (s.dexPenalty || 0) + 1);
    },
    text: `
      <p>Tu maintiens son poignet.</p>

      <blockquote>« Gaspard ? »</blockquote>

      <p>Ses yeux bougent vers toi.</p>

      <blockquote>« Tu m’entends ? »</blockquote>

      <p>Ses lèvres tremblent.</p>

      <p>Pendant un instant, tu crois qu’il essaie réellement de répondre.</p>

      <p>Puis sa bouche s’ouvre brutalement.</p>

      <p>Un cri rauque et impossible s’en échappe.</p>

      <p>Avec lui, une gerbe de terre noire te frappe au visage.</p>

      <p>Tu lâches immédiatement son bras.</p>

// Numérotation façon livre-jeu : 1 page = 1 nœud narratif.
// Le prologue est la page 01, puis les anciens chapitres 1 à 30 deviennent les pages 02 à 31.
const PAGE_ORDER = Array.from({ length: 46 }, (_, i) => `c${i + 1}`);
const PAGE_BY_NODE = Object.fromEntries(PAGE_ORDER.map((id, i) => [id, i + 1]));
const padPage = n => String(n).padStart(2, '0');
const imageBaseForPage = n => `La-Grotte-de-Valombre-${padPage(n)}`;
const IMAGE_EXTENSIONS = ['webp', 'png', 'jpg', 'jpeg'];

function addItem(state, id, name, description) {
  if (!state.inventory[id]) state.inventory[id] = { name, description };
}
function removeItem(state, id) {
  delete state.inventory[id];
}
function hasItem(state, id) {
  return !!state.inventory[id];
}
function equipHeavySword(state) {
  if (state.weapon === 'none') state.weapon = 'heavy';
}
function currentForce(state) {
  return Math.max(2, Math.min(12, state.baseForce + (state.forceBonus || 0)));
}
function currentDexterity(state) {
  const weaponModifier =
    state.weapon === 'heavy' ? -3 :
    state.weapon === 'light' ? 2 : 0;
  return Math.max(2, Math.min(12,
    state.baseDexterity +
    (state.dexBonus || 0) -
    (state.dexPenalty || 0) +
    weaponModifier
  ));
}
function combatPower(state) {
  if (state.weapon === 'heavy') return 10;
  if (state.weapon === 'light') return 4;
  if (state.weapon === 'black_blade') return 6;
  return 2;
}
function weaponLabel(state) {
  if (state.weapon === 'heavy') return 'Épée lourde de Sir Aldren';
  if (state.weapon === 'light') return 'Épée du forgeron';
  if (state.weapon === 'black_blade') return 'Lame noire';
  return 'Aucune';
}

function syncThrowingBlades(state) {
  if ((state.throwingBlades || 0) > 0) {
    state.inventory.lames_jet = {
      name: 'Lames de jet',
      description: 'De petites lames destinées à être lancées au visage pour gagner quelques secondes.',
      quantity: state.throwingBlades
    };
  } else {
    delete state.inventory.lames_jet;
  }
}

function rollDie6() {
  // Tirage uniforme sur 1–6 avec le générateur cryptographique du navigateur.
  // Les valeurs hors du plus grand multiple de 6 sont rejetées pour éviter tout biais.
  if (window.crypto && window.crypto.getRandomValues) {
    const buffer = new Uint32Array(1);
    const limit = 4294967292; // plus grand multiple de 6 < 2^32
    let value;

    do {
      window.crypto.getRandomValues(buffer);
      value = buffer[0];
    } while (value >= limit);

    return (value % 6) + 1;
  }

  return Math.floor(Math.random() * 6) + 1;
}

function roll2D6(state, statName, statValue) {
  const d1 = rollDie6();
  const d2 = rollDie6();
  state.lastDice = [d1, d2];
  state.lastTotal = d1 + d2;
  state.lastStatName = statName;
  state.lastStat = statValue;
  return state.lastTotal <= statValue;
}

function renderDie(value) {
  const layouts = {
    1: [5],
    2: [1,9],
    3: [1,5,9],
    4: [1,3,7,9],
    5: [1,3,5,7,9],
    6: [1,3,4,6,7,9]
  };

  const active = new Set(layouts[value] || []);
  let cells = '';

  for (let i = 1; i <= 9; i++) {
    cells += `<span class="die-cell">${active.has(i) ? '<i></i>' : ''}</span>`;
  }

  return `<span class="die-visual" aria-label="Dé : ${value}">${cells}</span>`;
}

function diceResultHtml(state) {
  if (!state.lastDice) return '';

  const [d1,d2] = state.lastDice;

  return `
    <div class="dice-result">
      <div class="dice-faces">
        ${renderDie(d1)}
        ${renderDie(d2)}
      </div>
      <p class="dice-values">Dé 1 : <strong>${d1}</strong> &nbsp;·&nbsp; Dé 2 : <strong>${d2}</strong></p>
      <p><strong>Total : ${state.lastTotal}</strong></p>
      <p><strong>${state.lastStatName} : ${state.lastStat}</strong></p>
    </div>
  `;
}

function escapeHtml(value) {
  return String(value || '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;');
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? { ...defaultState(), ...JSON.parse(saved) } : defaultState();
  } catch { return defaultState(); }
}
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    // Certains aperçus/lecteurs HTML bloquent le stockage local.
    // Le jeu reste jouable pendant la session.
  }
}


function setCheckpoint(state, label) {
  state.currentCheckpoint = label;
  try {
    localStorage.setItem(CHECKPOINT_KEY, JSON.stringify(state));
  } catch (e) {}
}

function hasCheckpoint() {
  try { return !!localStorage.getItem(CHECKPOINT_KEY); }
  catch (e) { return false; }
}

function restartFromCheckpoint() {
  try {
    const saved = localStorage.getItem(CHECKPOINT_KEY);
    if (!saved) return restartGame();

    const journalBackup = state.journal || '';
    state = { ...defaultState(), ...JSON.parse(saved) };
    state.journal = journalBackup || state.journal || '';

    saveState();
    closeDrawer();
    closeModal();
    closeJournal();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    restartGame();
  }
}

function enterNode(id) {
  const node = STORY[id];
  if (!node) return;

  state.node = id;

  if (!state.visited[id]) {
    state.visited[id] = true;
    if (typeof node.onEnter === 'function') node.onEnter(state);
  }

  state.history.push(id);

  if (id === 'c8' && !hasCheckpoint()) {
    setCheckpoint(state, 'Sortie de Valombre');
  }

  saveState();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function loadPageImage(pageNumber, title) {
  const base = imageBaseForPage(pageNumber);
  imageLabel.textContent = base;
  storyImage.classList.add('hidden');
  imagePlaceholder.style.display = 'grid';
  storyImage.alt = title ? `Illustration — ${title}` : `Illustration page ${padPage(pageNumber)}`;

  let index = 0;
  const tryNext = () => {
    if (index >= IMAGE_EXTENSIONS.length) {
      storyImage.removeAttribute('src');
      storyImage.classList.add('hidden');
      imagePlaceholder.style.display = 'grid';
      return;
    }
    const ext = IMAGE_EXTENSIONS[index++];
    storyImage.onload = () => {
      storyImage.classList.remove('hidden');
      imagePlaceholder.style.display = 'none';
    };
    storyImage.onerror = tryNext;
    storyImage.src = `./images/${base}.${ext}`;
  };
  tryNext();
}


function ensureJournal() {
  if (typeof state.journal !== 'string') state.journal = '';
}

let journalTimer = null;

function saveJournalNow() {
  ensureJournal();
  state.journal = journalText.value;
  saveState();
  journalStatus.textContent = 'Sauvegardé';
}

function openJournal() {
  ensureJournal();
  journalText.value = state.journal;
  journalPanel.classList.remove('hidden');
  journalPanel.setAttribute('aria-hidden','false');
}

function closeJournal() {
  if (!journalPanel.classList.contains('hidden')) saveJournalNow();
  journalPanel.classList.add('hidden');
  journalPanel.setAttribute('aria-hidden','true');
}

function scheduleJournalSave() {
  journalStatus.textContent = 'Sauvegarde…';
  clearTimeout(journalTimer);
  journalTimer = setTimeout(saveJournalNow, 250);
}

journalText.addEventListener('input', scheduleJournalSave);

function render() {
  const node = STORY[state.node] || STORY.start;

  if (node.sheet) {
    chapterNumber.textContent = 'FICHE DU HÉROS';
    imageFrame.classList.add('hidden');
  } else {
    const pageNumber = PAGE_BY_NODE[state.node] || 1;
    chapterNumber.textContent = `PAGE ${padPage(pageNumber)}`;
    imageFrame.classList.remove('hidden');
    loadPageImage(pageNumber, node.title || '');
  }

  chapterTitle.textContent = node.title || '';
  storyText.innerHTML = typeof node.text === 'function' ? node.text(state) : node.text;

  const heroNameInput = document.getElementById('heroNameInput');
  if (heroNameInput) {
    heroNameInput.addEventListener('input', event => {
      state.heroName = event.target.value.slice(0,24);
      saveState();
    });
  }

  const itemCount = Object.keys(state.inventory).length;
  inventoryCount.textContent = itemCount;

  statusTags.innerHTML = '';

  if (!node.sheet) {
    const labels = [
      `♥ ${state.hp}/${state.maxHp}`,
      `Chance ${state.chance}/12`,
      `Force ${currentForce(state)}/12`,
      `Dextérité ${currentDexterity(state)}/12`,
      `Puissance ${combatPower(state)}`
    ];

    if (state.silver > 0) labels.push(`${state.silver} argent`);
    if (state.goldCoins > 0) labels.push(`${state.goldCoins} or`);

    labels.forEach(label => {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = label;
      statusTags.appendChild(tag);
    });
  }

  const availableChoices =
    typeof node.choices === 'function' ? node.choices(state) : (node.choices || []);

  choices.innerHTML = '';

  availableChoices.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';

    const destinationPage = PAGE_BY_NODE[choice.to];
    const destination = destinationPage
      ? `<span class="choice-dest">Rendez-vous à la page ${padPage(destinationPage)}</span>`
      : '';

    btn.innerHTML =
      `<span class="choice-index">${i + 1}</span>` +
      `<span class="choice-copy"><span>${choice.label}</span>${destination}</span>`;

    btn.addEventListener('click', () => {
      if (choice.action === 'checkpoint') {
        restartFromCheckpoint();
        return;
      }

      if (choice.action === 'restart') {
        restartGame();
        return;
      }

      if (typeof choice.effect === 'function') choice.effect(state);
      enterNode(choice.to);
    });

    choices.appendChild(btn);
  });
}

function restartGame() {
  // Redémarrage direct : window.confirm() est bloqué dans certains aperçus HTML.
  state = defaultState();
  try {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(CHECKPOINT_KEY);
  } catch (e) {}
  saveState();
  closeDrawer();
  closeModal();
  closeJournal();
  render();
  try {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    window.scrollTo(0, 0);
  }
}

function useHealingPotion() {
  if (!hasItem(state,'potion_guerison')) return;

  if (state.hp >= state.maxHp) {
    openInventory();
    return;
  }

  state.hp = Math.min(state.maxHp, state.hp + 2);
  removeItem(state,'potion_guerison');
  saveState();
  render();
  openInventory();
}

function openParchment() {
  modalTitle.textContent = 'Parchemin ancien';

  modalContent.innerHTML = `
    <img
      class="inventory-parchment-image"
      src="./images/objets/La-Grotte-de-Valombre-Parchemin.png"
      alt="Parchemin ancien"
      onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
    >
    <div class="inventory-image-fallback">
      Ton image apparaîtra ici dès que tu ajouteras :
      <br><strong>images/objets/La-Grotte-de-Valombre-Parchemin.png</strong>
    </div>

    <div class="parchment-verse">
      <strong>L’œil qui dort doit demeurer fermé,</strong><br>
      <strong>Car nul vivant ne doit le réveiller.</strong><br><br>
      <strong>Là où le soufre vient empoisonner l’air,</strong><br>
      <strong>Détourne tes pas et rebrousse en arrière.</strong><br><br>
      <strong>Lorsque les liens ne pourront plus céder,</strong><br>
      <strong>Cherche la lame noire : elle seule peut libérer.</strong>
    </div>

    <button class="inventory-action-btn" data-action="back-inventory">
      Retour à l’inventaire
    </button>
  `;
}

function openInventory() {
  modalTitle.textContent = 'Inventaire';

  const items = Object.entries(state.inventory);

  const moneyLine =
    `<div class="inventory-topline">Argent : ${state.silver} · Or : ${state.goldCoins} · Arme : ${weaponLabel(state)}</div>`;

  const list = items.length
    ? `<div class="inventory-list">${items.map(([id,item]) => {
        let action = '';

        if (id === 'parchemin') {
          action = `
            <div class="inventory-actions">
              <button class="inventory-action-btn" data-action="read-parchment">
                Lire le parchemin
              </button>
            </div>`;
        }

        if (id === 'potion_guerison') {
          action = `
            <div class="inventory-actions">
              <button class="inventory-action-btn" data-action="use-potion"
                ${state.hp >= state.maxHp ? 'disabled' : ''}>
                Boire la potion (+2 PV)
              </button>
            </div>`;
        }

        if (id === 'lame_noire') {
          action = `
            <div class="inventory-actions">
              <button class="inventory-action-btn" data-action="equip-black-blade">
                Équiper la lame noire
              </button>
            </div>`;
        }

        return `
          <div class="inventory-item">
            <strong>${item.name}${item.quantity ? ` × ${item.quantity}` : ''}</strong>
            <p>${item.description}</p>
            ${action}
          </div>`;
      }).join('')}</div>`
    : `<div class="inventory-empty">Tu ne transportes encore aucun objet particulier.</div>`;

  modalContent.innerHTML = moneyLine + list;
  modal.classList.remove('hidden');
  modalBackdrop.classList.remove('hidden');
}

function closeModal() {
  modal.classList.add('hidden');
  modalBackdrop.classList.add('hidden');
}
function openDrawer() {
  drawer.classList.add('open');
  drawer.setAttribute('aria-hidden','false');
  drawerBackdrop.classList.remove('hidden');
}
function closeDrawer() {
  drawer.classList.remove('open');
  drawer.setAttribute('aria-hidden','true');
  drawerBackdrop.classList.add('hidden');
}

modalContent.addEventListener('click', event => {
  const button = event.target.closest('[data-action]');
  if (!button) return;

  if (button.dataset.action === 'read-parchment') {
    openParchment();
  } else if (button.dataset.action === 'back-inventory') {
    openInventory();
  } else if (button.dataset.action === 'use-potion') {
    useHealingPotion();
  } else if (button.dataset.action === 'equip-black-blade') {
    state.weapon = 'black_blade';
    saveState();
    render();
    openInventory();
  }
});

inventoryBtn.addEventListener('click', openInventory);
journalBtn.addEventListener('click', openJournal);
journalCloseBtn.addEventListener('click', closeJournal);
restartBtn.addEventListener('click', restartGame);
menuBtn.addEventListener('click', openDrawer);
closeDrawerBtn.addEventListener('click', closeDrawer);
drawerBackdrop.addEventListener('click', closeDrawer);
continueBtn.addEventListener('click', closeDrawer);
drawerInventoryBtn.addEventListener('click', () => { closeDrawer(); openInventory(); });
drawerRestartBtn.addEventListener('click', restartGame);
closeModalBtn.addEventListener('click', closeModal);
modalBackdrop.addEventListener('click', closeModal);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeDrawer(); closeModal(); closeJournal(); }
});

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

render();

  </script>
</body>
</html>
